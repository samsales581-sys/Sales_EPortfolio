* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
}

.nav-link {

    text-decoration: none;
    font-size: 1.1rem;
    font-weight: 500;
    letter-spacing: 1px;
    white-space: nowrap;
    color: #ffffff;
    transition:
        color 0.3s ease,
        text-shadow 0.3s ease;
}

.nav-link:hover {

    color: #ff6b6b;
    text-shadow:
        0 0 10px
        rgba(255,107,107,0.8),
        0 0 22px
        rgba(255,107,107,0.5);
}

.nav-link.active {
    color: #ff6b6b;
}

.card {

    display: flex;
    align-items: flex-start;
    margin-bottom: 1.2rem;
    padding: 1.2rem;
    background-color:
        #1a1a1a;
    border-radius: 10px;
    border-left:
        4px solid #ff6b6b;
    transition:
        background-color 0.3s ease,
        transform 0.3s ease,
        box-shadow 0.3s ease;
}


.card:hover {
    background-color: #222222;
    transform: translateX(5px);
    box-shadow: none;
}


.card-link {
    color: #cccccc;
    text-decoration: none;
    transition:
        color 0.3s ease,
        text-shadow 0.3s ease;
}

.card-link:hover {
    color: #ff6b6b;
    text-shadow:
        0 0 8px
        rgba(255,107,107,0.7);
}

.map-btn {
    display: inline-block;
    padding:
        0.5rem 1.2rem;
    background:
        linear-gradient(
            135deg,
            #ff2200,
            #cc1100
        );

    color: #ffffff;
    border-radius: 8px;
    text-decoration: none;
    font-size: 1rem;
    font-weight: 600;
    box-shadow:
        0 4px 15px
        rgba(255,34,0,0.4);
    transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
}

.map-btn:hover {
    transform:
        translateY(-3px);
    box-shadow:
        0 8px 30px
        rgba(255,34,0,0.7),
        0 0 20px
        rgba(255,107,107,0.4);
}

.address-section {
    height: 100vh;
    height: 100dvh;
    padding:
        90px 5% 20px;
    overflow: hidden;
}

@media (max-width: 850px) {
    body {
        overflow-y: auto;
    }
    .address-section {
        height: auto;
        min-height: 100vh;
        overflow: visible;
        padding:
            120px 5% 50px;
    }
    nav ul {
        gap: 18px !important;
        justify-content:
            center !important;
        flex-wrap:
            wrap !important;
    }
}
