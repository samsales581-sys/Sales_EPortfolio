<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Thirdy Portfolio</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;
        }


        /* ==================================
           EXISTING PORTFOLIO PAGE
        ================================== */

        #portfolioFrame {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            border: none;

            margin: 0;
            padding: 0;

            z-index: 1;

            background: #1a0000;
        }



        /* ==================================
           IOS STYLE DYNAMIC ISLAND
        ================================== */

        .dynamic-island {
            position: fixed;

            top: 90px;
            left: 50%;

            transform: translateX(-50%);

            width: 390px;

            background: rgba(5, 5, 5, 0.96);

            border-radius: 35px;

            z-index: 999999;

            color: white;

            overflow: hidden;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.45),
                0 0 20px rgba(29, 185, 84, 0.15);

            transition:
                width 0.3s ease,
                border-radius 0.3s ease,
                box-shadow 0.3s ease;
        }


        .dynamic-island.expanded {
            width: 500px;

            border-radius: 28px;
        }



        /* ==================================
           ISLAND HEADER
        ================================== */

        .island-header {
            width: 100%;

            min-height: 58px;

            display: grid;

            grid-template-columns:
                38px
                minmax(0, 1fr)
                auto
                18px;

            align-items: center;

            gap: 10px;

            padding:
                9px
                13px;

            border: none;

            background: transparent;

            color: white;

            cursor: pointer;

            text-align: left;
        }



        /* Spotify Logo */

        .spotify-icon {
            width: 36px;
            height: 36px;

            border-radius: 50%;

            display: flex;

            justify-content: center;
            align-items: center;

            background: #1db954;

            color: #071a0d;

            font-size: 21px;
        }



        /* Song information */

        .song-info {
            min-width: 0;
        }


        .song-info strong {
            display: block;

            overflow: hidden;

            white-space: nowrap;

            text-overflow: ellipsis;

            font-size: 13px;
        }


        .song-info small {
            display: block;

            margin-top: 2px;

            color: #999;

            font-size: 11px;

            overflow: hidden;

            white-space: nowrap;

            text-overflow: ellipsis;
        }



        /* ==================================
           ANIMATED MUSIC BARS
        ================================== */

        .music-bars {
            display: flex;

            align-items: center;

            gap: 2px;

            height: 22px;
        }


        .music-bars span {
            width: 3px;

            border-radius: 5px;

            background: #1db954;

            animation:
                soundBar
                0.8s
                infinite
                alternate;
        }


        .music-bars span:nth-child(1) {
            height: 7px;
        }

        .music-bars span:nth-child(2) {
            height: 16px;

            animation-delay: 0.15s;
        }

        .music-bars span:nth-child(3) {
            height: 10px;

            animation-delay: 0.30s;
        }

        .music-bars span:nth-child(4) {
            height: 20px;

            animation-delay: 0.45s;
        }


        @keyframes soundBar {

            from {
                transform: scaleY(0.4);
            }

            to {
                transform: scaleY(1);
            }

        }



        /* Arrow */

        .arrow {
            color: #999;

            font-size: 12px;

            transition:
                transform 0.3s ease;
        }


        .dynamic-island.expanded .arrow {
            transform: rotate(180deg);
        }



        /* ==================================
           EXPANDED PLAYER
        ================================== */

        .player-area {
            max-height: 0;

            opacity: 0;

            overflow: hidden;

            padding:
                0
                12px;

            transition:
                max-height 0.4s ease,
                opacity 0.3s ease,
                padding 0.4s ease;
        }


        .dynamic-island.expanded .player-area {
            max-height: 280px;

            opacity: 1;

            padding:
                0
                12px
                12px;
        }



        #spotifyPlayer {
            width: 100%;

            height: 152px;

            border: none;

            border-radius: 14px;

            display: block;
        }



        /* Spotify external button */

        .spotify-button {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 7px;

            margin-top: 8px;

            padding:
                10px
                15px;

            border-radius: 30px;

            background: #1db954;

            color: #071a0d;

            text-decoration: none;

            font-size: 12px;

            font-weight: bold;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }


        .spotify-button:hover {
            background: #28d766;

            transform: translateY(-1px);
        }



        /* ==================================
           RESPONSIVE
        ================================== */

        @media (max-width: 600px) {

            .dynamic-island {
                width: calc(100% - 30px);

                top: 100px;
            }


            .dynamic-island.expanded {
                width: calc(100% - 20px);
            }


            .music-bars {
                display: none;
            }

        }

    </style>
</head>



<body>


<!-- ==================================
     YOUR ORIGINAL PORTFOLIO
================================== -->

<iframe
    id="portfolioFrame"
    src="home.html"
    title="Thirdy Portfolio">
</iframe>



<!-- ==================================
     PERSISTENT DYNAMIC ISLAND
================================== -->

<div
    id="dynamicIsland"
    class="dynamic-island">


    <button
        id="islandHeader"
        class="island-header"
        type="button">


        <div class="spotify-icon">

            <i class="fab fa-spotify"></i>

        </div>



        <div class="song-info">

            <strong id="currentSong">

                Cinderella
                (feat. Ty Dolla $ign)

            </strong>


            <small id="currentArtist">

                Mac Miller,
                Ty Dolla $ign

            </small>

        </div>



        <div class="music-bars">

            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>



        <i
            class="fas fa-chevron-down arrow">
        </i>


    </button>



    <div class="player-area">


        <iframe
            id="spotifyPlayer"

            src="https://open.spotify.com/embed/track/2lpygKqzPFtItQ4ss3cgfb?utm_source=generator&theme=0"

            allow="
                autoplay;
                clipboard-write;
                encrypted-media;
                fullscreen;
                picture-in-picture
            "

            loading="eager">

        </iframe>



        <a
            id="spotifyLink"

            class="spotify-button"

            href="https://open.spotify.com/track/2lpygKqzPFtItQ4ss3cgfb"

            target="_blank"

            rel="noopener">


            <i class="fab fa-spotify"></i>


            Open Song on Spotify


        </a>


    </div>


</div>



<script>

    /* ==================================
       DYNAMIC ISLAND OPEN / CLOSE
    ================================== */

    const dynamicIsland =
        document.getElementById(
            "dynamicIsland"
        );


    const islandHeader =
        document.getElementById(
            "islandHeader"
        );


    islandHeader.addEventListener(
        "click",
        function () {

            dynamicIsland
                .classList
                .toggle(
                    "expanded"
                );

        }
    );



    /* ==================================
       CHANGE SPOTIFY SONG
    ================================== */

    const spotifyPlayer =
        document.getElementById(
            "spotifyPlayer"
        );


    const currentSong =
        document.getElementById(
            "currentSong"
        );


    const currentArtist =
        document.getElementById(
            "currentArtist"
        );


    const spotifyLink =
        document.getElementById(
            "spotifyLink"
        );



    function changeSpotifySong(
        trackID,
        title,
        artist
    ) {

        spotifyPlayer.src =

            "https://open.spotify.com/embed/track/"
            +
            trackID
            +
            "?utm_source=generator&theme=0";


        currentSong.textContent =
            title;


        currentArtist.textContent =
            artist;


        spotifyLink.href =

            "https://open.spotify.com/track/"
            +
            trackID;


        dynamicIsland
            .classList
            .add(
                "expanded"
            );

    }



    /* ==================================
       RECEIVE SONG FROM ABOUT PAGE
    ================================== */

    window.addEventListener(
        "message",
        function (event) {

            if (
                event.data &&
                event.data.type ===
                "spotify-track"
            ) {

                changeSpotifySong(

                    event.data.id,

                    event.data.title,

                    event.data.artist

                );

            }

        }
    );

</script>


</body>
</html>
